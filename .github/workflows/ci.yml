name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast tier: lint + the tests that do NOT solve a model. These are cheap, so
  # they run on every operating system and every supported Python version. This
  # is where cross-platform and cross-Python problems (imports, packaging,
  # syntax) and the CSV-vs-DuckDB read parity are caught.
  fast:
    name: fast (lint + no-solve) - ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install flake8 pytest

      - name: Lint with flake8 (syntax errors only)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,.git,build,dist

      - name: Run no-solve tests
        run: |
          pytest -vv -m "not solve" tests/

  # Solve tier: the validation cases. Each case is solved from both its CSV
  # folder and its .duckdb file and the total cost is checked against a golden
  # value. The model maths is the same on every platform, so we solve once per
  # operating system on a single Python version; cross-Python coverage comes
  # from the fast tier above.
  solve:
    name: solve (validation cases) - ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout highspy

      - name: Run validation cases (CSV + DuckDB)
        run: |
          pytest -vv -m solve --timeout=1800 tests/
